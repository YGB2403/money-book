<script>
const KEY_RECORDS = "money_records";
const KEY_CAT_INC = "cat_income";
const KEY_CAT_EXP = "cat_expense";
const KEY_BG_MAIN = "bg_main";
const KEY_BG_LIST = "bg_list";
const KEY_BUDGET = "month_budget";
let currentDetailIdx=null;
function initStorage(){
    if(!localStorage.getItem(KEY_RECORDS)) localStorage.setItem(KEY_RECORDS,JSON.stringify([]));
    if(!localStorage.getItem(KEY_CAT_INC)) localStorage.setItem(KEY_CAT_INC,JSON.stringify(["工资","兼职","红包"]));
    if(!localStorage.getItem(KEY_CAT_EXP)) localStorage.setItem(KEY_CAT_EXP,JSON.stringify(["餐饮","交通","购物","房租"]));
    if(!localStorage.getItem(KEY_BUDGET)) localStorage.setItem(KEY_BUDGET,"0");
}
function getRecords(){return JSON.parse(localStorage.getItem(KEY_RECORDS))||[]}
function saveRecords(arr){localStorage.setItem(KEY_RECORDS,JSON.stringify(arr))}
function getIncCats(){return JSON.parse(localStorage.getItem(KEY_CAT_INC))||[]}
function saveIncCats(a){localStorage.setItem(KEY_CAT_INC,JSON.stringify(a))}
function getExpCats(){return JSON.parse(localStorage.getItem(KEY_CAT_EXP))||[]}
function saveExpCats(a){localStorage.setItem(KEY_CAT_EXP,JSON.stringify(a))}
function getBudget(){return Number(localStorage.getItem(KEY_BUDGET))||0}
function saveBudgetVal(v){localStorage.setItem(KEY_BUDGET,String(Number(v)))}

function compressImage(file,maxSide=1200,quality=0.6){
    return new Promise((resolve)=>{
        const reader=new FileReader();
        reader.onload=ev=>{
            const img=new Image();
            img.onload=()=>{
                let w=img.width;
                let h=img.height;
                if(w>maxSide||h>maxSide){
                    if(w>h){h=h*maxSide/w;w=maxSide}else{w=w*maxSide/h;h=maxSide}
                }
                const canvas=document.createElement("canvas");
                canvas.width=w;canvas.height=h;
                const ctx=canvas.getContext("2d");
                ctx.drawImage(img,0,0,w,h);
                resolve(canvas.toDataURL("image/jpeg",quality));
            }
            img.src=ev.target.result;
        }
        reader.readAsDataURL(file);
    })
}
document.getElementById("popPhotoInput").onchange=async function(e){
    const file=e.target.files[0];
    if(!file)return;
    const base=await compressImage(file);
    document.getElementById("popPhotoBase64").value=base;
    document.getElementById("photoPreviewBox").innerHTML=`<img src="${base}" style="max-width:100%;max-height:200px;border-radius:8px;">`;
}
let tabIndex=0;
function switchTab(idx){
    tabIndex=idx;
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
    document.querySelectorAll(".tab-nav>div").forEach((el,i)=>el.classList.toggle("active",i===idx));
    if(idx===0){
        document.getElementById("page-book").classList.add("show");
        setBookDefaultDate();refreshBookPage();calcMonthSummary();
    }else if(idx===1){
        document.getElementById("page-stat").classList.add("show");
        setStatDefaultDate();refreshStatPage();
    }else if(idx===2){
        document.getElementById("page-setting").classList.add("show");
    }
}
function openMask(id){document.getElementById(id).classList.add("show")}
function closeMask(id){document.getElementById(id).classList.remove("show")}
function openAddPop(){
    document.getElementById("popTitle").innerText="新增记账";
    document.getElementById("editIndex").value="";
    document.getElementById("popDate").value=getYmd(new Date());
    document.getElementById("popMoney").value="";
    document.getElementById("popRemark").value="";
    document.getElementById("popPhotoBase64").value="";
    document.getElementById("photoPreviewBox").innerHTML="";
    document.getElementById("popPhotoInput").value="";
    refreshPopCat();
    openMask("addPop");
}
function openBudgetPop(){
    document.getElementById("inputBudget").value=getBudget();
    openMask("budgetPop");
}
function saveBudget(){
    const v=Number(document.getElementById("inputBudget").value)||0;
    saveBudgetVal(v);
    closeMask("budgetPop");
    calcMonthSummary();
}
function getYmd(d){
    const t=new Date(d);
    return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}
function parseYmd(s){return new Date(s)}
function setBookDefaultDate(){
    const now=new Date();
    const start=new Date();
    start.setMonth(start.getMonth()-1);
    document.getElementById("bookStart").value=getYmd(start);
    document.getElementById("bookEnd").value=getYmd(now);
}
function setStatDefaultDate(){
    const now=new Date();
    const first=new Date(now.getFullYear(),now.getMonth(),1);
    document.getElementById("statStart").value=getYmd(first);
    document.getElementById("statEnd").value=getYmd(now);
}
function openExportPanel(){
    const now=new Date();
    const first=new Date(now.getFullYear(),now.getMonth(),1);
    document.getElementById("exportStart").value=getYmd(first);
    document.getElementById("exportEnd").value=getYmd(now);
    openMask("exportPanel");
}
function filterByDate(allRec,startStr,endStr){
    const s=parseYmd(startStr).getTime();
    const e=parseYmd(endStr).getTime()+24*3600*1000;
    return allRec.filter(r=>{
        const rt=new Date(r.date).getTime();
        return rt>=s && rt<e;
    })
}
function sortRecordDesc(list){
    return [...list].sort((a,b)=>{
        return new Date(b.date).getTime() - new Date(a.date).getTime();
    })
}
function calcMonthSummary(){
    const now=new Date();
    const y=now.getFullYear();
    const m=now.getMonth();
    const monthStart=getYmd(new Date(y,m,1));
    const monthEnd=getYmd(new Date(y,m+1,0));
    const monthList=filterByDate(getRecords(),monthStart,monthEnd);
    let min=0,mout=0;
    monthList.forEach(r=>{
        if(r.type==="收入") min+=Number(r.money);
        else mout+=Number(r.money);
    })
    const bal=min‑mout;
    document.getElementById("monIn").innerText=min.toFixed(2);
    document.getElementById("monOut").innerText=mout.toFixed(2);
    document.getElementById("monBal").innerText=bal.toFixed(2);
    const bud=getBudget();
    document.getElementById("budgetValue").innerText=bud;
    document.getElementById("budgetUsed").innerText=mout.toFixed(2);
    const bar=document.getElementById("budgetBar");
    const tip=document.getElementById("budgetTip");
    const pctTextDom=document.getElementById("budgetPercentText");
    if(bud<=0){
        bar.style.width="0%";
        tip.innerText="未设置月度预算";
        pctTextDom.innerText="0%";
    }else{
        const pct=Math.min(100,(mout/bud)*100);
        bar.style.width=pct+"%";
        pctTextDom.innerText=pct.toFixed(1)+"%";
        if(pct>=100){
            bar.className="progress‑bar progress‑bar‑danger";
            tip.innerText="⚠️预算已超支！";
        }else if(pct>=70){
            bar.className="progress‑bar progress‑bar‑warning";
            tip.innerText="预算即将用完";
        }else{
            bar.className="progress‑bar";
            tip.innerText="预算正常";
        }
    }
}

function refreshBookPage(){
    const s=document.getElementById("bookStart").value;

    const all=getRecords();
    const list=sortRecordDesc(filterByDate(all,s,e));
    let sumIn=0,sumOut=0;
    list.forEach(r=>{
        if(r.type==="收入") sumIn+=Number(r.money);
        else sumOut+=Number(r.money);
    })
    document.getElementById("bookTotalIn").innerText=sumIn.toFixed(2);
    document.getElementById("bookTotalOut").innerText=sumOut.toFixed(2);
    const box=document.getElementById("bookRecordList");
    box.innerHTML="";
    list.forEach((rec)=>{
        const realIdx=all.findIndex(x=>x.date===rec.date&&x.money===rec.money&&x.category===rec.category&&x.remark===rec.remark);
        const div=document.createElement("div");
        div.className=rec.type==="收入"?"row‑income":"row‑expense";
        div.onclick=()=>openDetailPop(realIdx);
        div.innerHTML=`
        <div class="row‑top">

            <div class="row‑right">${rec.type==="收入"?"+":"‑"}${Number(rec.money).toFixed(2)}</div>
        </div>
        ${rec.remark?`<div class="row‑remark">${rec.remark}</div>`:""}
        ${rec.photoBase64?'<div style="font‑size:12px;color:#888;">📷有照片附件</div>':''}

    <p><b>金额：</b>${Number(rec.money).toFixed(2)}</p>

    document.getElementById("popRemark").value=rec.remark;
    document.getElementById("popDate").value=rec.date;
    document.getElementById("popPhotoBase64").value=rec.photoBase64||"";
    if(rec.photoBase64){
        document.getElementById("photoPreviewBox").innerHTML=`<img src="${rec.photoBase64}" style="max‑width:100%;max‑height:200px;border‑radius:8px;">`;

function delCurrentRecord(){
    if(!confirm("确定删除这条记录？"))return;
    const arr=getRecords();
    arr.splice(currentDetailIdx,1);

    closeMask("detailPop");

function submitRecord(){
    const editIdx=document.getElementById("editIndex").value;
    const type=document.getElementById("popType").value;
    const category=document.getElementById("popCategory").value;
    const money=parseFloat(document.getElementById("popMoney").value);
    const remark=document.getElementById("popRemark").value.trim();
    const date=document.getElementById("popDate").value;
    const photo=document.getElementById("popPhotoBase64").value;
    if(!money||money<=0){alert("请输入有效金额");return;}
    if(!date){alert("请选择日期");return;}
    const item={type,category,money,remark,date,photoBase64:photo};
    const arr=getRecords();
    if(editIdx!==""&&editIdx!==null){
        arr[Number(editIdx)]=item;
    }else{
        arr.push(item);
    }
    saveRecords(arr);
    closeMask("addPop");
    refreshBookPage();
}

function refreshStatPage(){
    const s=document.getElementById("statStart").value;
    const e=document.getElementById("statEnd").value;
    const list=filterByDate(getRecords(),s,e);
    let sumIn=0,sumOut=0;
    list.forEach(r=>{
        if(r.type==="收入")sumIn+=Number(r.money);else sumOut+=Number(r.money);
    })
    document.getElementById("statInSum").innerText=sumIn.toFixed(2);
    document.getElementById("statOutSum").innerText=sumOut.toFixed(2);
    const expGroup={},incGroup={};
    list.forEach(r=>{
        if(r.type==="支出"){
            if(!expGroup[r.category])expGroup[r.category]=0;
            expGroup[r.category]+=Number(r.money);
        }else{
            if(!incGroup[r.category])incGroup[r.category]=0;
            incGroup[r.category]+=Number(r.money);
        }
    })
    const sortObj=(obj)=>Object.entries(obj).sort((a,b)=>b[1]‑a[1]);
    let htmExp="",htmInc="";
    const expSorted=sortObj(expGroup);
    const incSorted=sortObj(incGroup);
    expSorted.forEach(([k,v])=>htmExp+=`<div class="rank‑item">${k}: ${v.toFixed(2)}元</div>`);
    incSorted.forEach(([k,v])=>htmInc+=`<div class="rank‑item">${k}: ${v.toFixed(2)}元</div>`);
    document.getElementById("rankExp").innerHTML=htmExp||"<div class='rank‑item'>暂无支出数据</div>";
    document.getElementById("rankInc").innerHTML=htmInc||"<div class='rank‑item'>暂无收入数据</div>";
}
function exportExcel(){
    const s=document.getElementById("exportStart").value;
    const e=document.getElementById("exportEnd").value;
    const typeSel=document.querySelector('input[name="exportType"]:checked').value;
    let arr=filterByDate(getRecords(),s,e);
    if(typeSel==="exp") arr=arr.filter(x=>x.type==="支出");
    if(typeSel==="inc") arr=arr.filter(x=>x.type==="收入");
    if(arr.length===0){alert("所选时间段没有记账记录");return;}
    const sheetData=arr.map(r=>({"日期":r.date,"类型":r.type,"分类":r.category,"金额":Number(r.money),"备注":r.remark}));
    const ws=XLSX.utils.json_to_sheet(sheetData);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"记账数据");
    try{
        XLSX.writeFile(wb,`记账_${s}_${e}.xlsx`);
        alert("Excel导出已触发");
    }catch(err){
        alert("Excel导出失败，请优先导出JSON备份");
    }
}
async function exportRecordImage(){
    const s=document.getElementById("exportStart").value;
    const e=document.getElementById("exportEnd").value;
    const typeSel=document.querySelector('input[name="exportType"]:checked').value;
    let arr=filterByDate(getRecords(),s,e);
    if(typeSel==="exp") arr=arr.filter(x=>x.type==="支出");
    if(typeSel==="inc") arr=arr.filter(x=>x.type==="收入");
    if(arr.length===0){alert("该时间段没有记账记录，无法导出图片");return;}
    const cleanArr = arr.map(item=>({...item,photoBase64:undefined}));
    const tempDiv=document.createElement("div");
    tempDiv.style.padding="16px";
    tempDiv.style.background="#fff";
    tempDiv.style.color="#222";
    tempDiv.style.fontSize="14px";
    let htmlText=`<h3>记账导出 ${s} ~ ${e}</h3>`;
    htmlText+=`<table border='1' cellpadding='6' cellspacing='0' style="width:100%;border‑collapse:collapse;">
    <thead><tr><th>日期</th><th>类型</th><th>分类</th><th>金额</th><th>备注</th></tr></thead><tbody>`;
    cleanArr.forEach(r=>{
        htmlText+=`<tr><td>${r.date}</td><td>${r.type}</td><td>${r.category}</td><td>${Number(r.money).toFixed(2)}</td><td>${(r.remark||"")}</td></tr>`;
    })
    htmlText+="</tbody></table>";
    tempDiv.innerHTML=htmlText;
    tempDiv.style.position="absolute";
    tempDiv.style.left="-9999px";
    document.body.appendChild(tempDiv);
    try{
        const canvas=await html2canvas(tempDiv,{backgroundColor:"#ffffff"});
        const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));
        saveAs(blob,`记账图片_${s}_${e}.png`);
        alert("图片导出已触发");
    }catch(err){
        alert("导出截图失败，请优先导出JSON备份");
    }
    document.body.removeChild(tempDiv);
}
function exportJsonBackup(){

    const blob=new Blob([jsonStr],{type:"application/json"});

}
document.getElementById("jsonImportFile").onchange=function(e){
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
        try{
            const obj=JSON.parse(String(ev.target.result));
            if(!confirm("导入会覆盖当前全部数据，确认继续？"))return;
            saveRecords(obj.records||[]);
            saveIncCats(obj.catIncome||[]);
            saveExpCats(obj.catExpense||[]);
            saveBudgetVal(obj.budget||0);
            alert("导入备份成功！页面将刷新");
            window.location.reload();
        }catch(ex){
            alert("JSON文件解析失败，不是有效备份");
        }
    };
    reader.readAsText(file);
};
